[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomedical-continued-pretraining-lab"
version = "0.1.0"
description = "Reproducible data recipes and evaluation for biomedical continued pretraining"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.1"]

[project.optional-dependencies]
data = ["datasets>=2.19", "datasketch>=1.6"]
train = ["transformers>=4.45", "accelerate>=0.30"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

